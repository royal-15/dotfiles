# HYPRLOCK CONFIGURATION
# Aesthetic Rice Lockscreen consuming native theme tokens

source = ~/.config/hypr/hyprlock_colors.conf

# GENERAL SETTINGS
general {
    hide_cursor = true
    ignore_empty_input = true
}

# BACKGROUND
background {
    monitor =
    path = ~/.config/theme-switcher/state/blurred_wallpaper
    color = $background

    # Optimized contrast & brightness for text legibility
    blur_passes = 0
    contrast = 1.0
    brightness = 0.75
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# CLOCK (Minimal 12-hour digital clock)
label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%I:%M')"
    color = $accent
    font_size = 76
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 95
    halign = center
    valign = center

    # Soft ambient shadow
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.45)
    shadow_boost = 1.2
}

# DATE
label {
    monitor =
    text = cmd[update:60000] echo "$(date '+%A, %d %B')"
    color = $textDim
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 30
    halign = center
    valign = center
}

# INPUT FIELD (Floating Pill)
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1

    inner_color = $surface
    outer_color = $accent $accentAlt 45deg
    font_color = $text

    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <span font_desc="JetBrainsMono Nerd Font 10" foreground="##a3a094"><i>Enter Password...</i></span>
    hide_input = false
    rounding = 24

    check_color = $accentAlt
    fail_color = $critical
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $warning
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false

    position = 0, -50
    halign = center
    valign = center
}

# MEDIA WIDGET (Compact, auto-hides when nothing is playing)
label {
    monitor =
    text = cmd[update:1000] playerctl metadata --format "$(printf '\x7b\x7btitle\x7d\x7d — \x7b\x7bartist\x7d\x7d')" 2>/dev/null
    color = $textDim
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, -115
    halign = center
    valign = center
}

# SESSION PILL (Subtle Battery Status)
label {
    monitor =
    text = cmd[update:10000] sh -c 's=$(cat /sys/class/power_supply/BAT0/status 2>/dev/null); c=$(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null); [ -n "$c" ] && ([ "$s" = "Charging" ] && echo "󰂄 ${c}%" || echo "󰁹 ${c}%")'
    color = $textDim
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, 30
    halign = center
    valign = bottom
}
